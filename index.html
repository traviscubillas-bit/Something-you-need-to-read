
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="page-header">
            <h1>Something You Need to Read</h1>
            <p>Let this sit with you for a moment.</p>
        </header>

        <section class="quote-box" aria-live="polite" aria-label="Random quote">
            <blockquote id="quote">
                Click the button to get a quote!
            </blockquote>

            <p id="author">— Unknown</p>

            <button id="new-quote" type="button">
                New Quote
            </button>

            <p id="status" role="status"></p>
        </section>
    </main>

    <audio id="background-music" loop preload="auto">
        <source src="Music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <script src="script.js"></script>
</body>
</html>
